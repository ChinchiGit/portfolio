name: Deploy to Docker Hub and Railway

on:
  push:
    branches:
      - ci-cd-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      # Instalar Docker Compose
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      # Crear archivo .env temporalmente
      - name: Create .env file
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_ADMIN=${{ secrets.VITE_ADMIN }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

      # Configuración de Docker para build y push
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker images
        run: docker-compose build

      - name: Push Client Docker image
        run: docker push chinchigit/portfolio_portfolio-client:latest

      - name: Push Server Docker image
        run: docker push chinchigit/portfolio_portfolio-server:latest

      # Instalar Railway CLI
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Iniciar sesión en Railway
      - name: Log in to Railway
        run: echo "${{ secrets.RAILWAY_API_TOKEN }}" | railway auth login --token-stdin

      # Despliegue a Railway usando las imágenes Docker de Docker Hub
      - name: Deploy Client to Railway
        run: railway container deploy --service client --image chinchigit/portfolio_portfolio-client:latest
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy Server to Railway
        run: railway container deploy --service server --image chinchigit/portfolio_portfolio-server:latest
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}